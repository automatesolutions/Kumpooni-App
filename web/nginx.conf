server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The install manifest. A missing file is a 404, never index.html.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    types {}
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  # Home screen icons and the favicon.
  location /icons/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
  }
  location = /favicon.ico {
    try_files $uri =404;
  }
}
